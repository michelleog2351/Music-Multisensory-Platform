name: Docs

on:
  push:
    branches:
      - develop
      - main

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Generate docs
        run: docfx docfx.json