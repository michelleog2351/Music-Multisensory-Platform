name: Feature Branch CI
run-name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches:
      - "*"
      - "!main"

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ./MusicBased_IOT_Platform/MusicBased_IOT_Platform.sln
      
      - name: Build
        run: dotnet build ./MusicBased_IOT_Platform/MusicBased_IOT_Platform.sln --no-restore
      
      - name: Run tests
        run: dotnet test ./MusicBased_IOT_Platform/MusicBased_IOT_Platform.sln --no-build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
